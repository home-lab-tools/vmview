# Builds the self-contained VmView.exe (native vmrdp.dll over FreeRDP from vcpkg + dotnet publish) on every
# push and PR, and publishes it as a GitHub Release when a `v*` tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The FreeRDP build from vcpkg takes ~40 min cold. Two caches keep it from happening twice:
#   - vcpkg's binary cache (one zip per built port, `files` provider under vcpkg-cache\) — saved after every
#     run, even a failed or cancelled one, and restored from the newest key available, so a half-finished cold
#     build still keeps the ports it got through, and a manifest change only rebuilds what actually changed;
#   - native\vcpkg_installed on the exact manifest hash — the fast path, build.ps1 skips `vcpkg install`.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      INSTALLED_KEY: vcpkg-installed-x64-windows-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}
      BINARY_KEY: vcpkg-bin-x64-windows-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore vcpkg_installed (exact manifest)
        id: installed
        uses: actions/cache/restore@v4
        with:
          path: native/vcpkg_installed
          key: ${{ env.INSTALLED_KEY }}

      - name: Restore vcpkg binary cache (newest)
        if: steps.installed.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: ${{ env.BINARY_KEY }}
          restore-keys: |
            vcpkg-bin-x64-windows-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}-
            vcpkg-bin-x64-windows-

      - name: Build vmrdp.dll
        shell: pwsh
        run: ./native/build.ps1

      # Saved whatever happened above: the port zips vcpkg managed to write are worth keeping.
      - name: Save vcpkg binary cache
        if: always() && steps.installed.outputs.cache-hit != 'true' && hashFiles('vcpkg-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: ${{ env.BINARY_KEY }}

      - name: Save vcpkg_installed
        if: steps.installed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native/vcpkg_installed
          key: ${{ env.INSTALLED_KEY }}

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref }}" -like 'refs/tags/v*') { "${{ github.ref_name }}".TrimStart('v') } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish VmView.exe
        shell: pwsh
        run: ./publish.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/VmView.exe -Algorithm SHA256).Hash.ToLower() + '  VmView.exe' | Out-File dist/VmView.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: VmView-${{ steps.ver.outputs.version }}
          path: |
            dist/VmView.exe
            dist/VmView.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VmView ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/VmView.exe
            dist/VmView.exe.sha256
