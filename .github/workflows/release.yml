# Builds the self-contained VmView.exe (native vmrdp.dll over FreeRDP from vcpkg + dotnet publish) on every
# push and PR, and publishes it as a GitHub Release when a `v*` tag is pushed:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The FreeRDP build from vcpkg takes ~40 min cold; native\vcpkg_installed is cached on the manifest hash, so
# a warm run only rebuilds the shim and the app.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache FreeRDP (vcpkg_installed)
        uses: actions/cache@v4
        with:
          path: native/vcpkg_installed
          key: vcpkg-x64-windows-${{ hashFiles('native/vcpkg.json', 'native/vcpkg-configuration.json') }}

      - name: Build vmrdp.dll
        shell: pwsh
        run: ./native/build.ps1

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref }}" -like 'refs/tags/v*') { "${{ github.ref_name }}".TrimStart('v') } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish VmView.exe
        shell: pwsh
        run: ./publish.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist/VmView.exe -Algorithm SHA256).Hash.ToLower() + '  VmView.exe' | Out-File dist/VmView.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: VmView-${{ steps.ver.outputs.version }}
          path: |
            dist/VmView.exe
            dist/VmView.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VmView ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/VmView.exe
            dist/VmView.exe.sha256
